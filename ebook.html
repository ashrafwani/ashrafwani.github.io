    <!-- E-Book Page Styling -->
    <style>

        /* ==============================================
           E-BOOK PAGE
        ================================================= */

        body {
            background: #0F172A;
            color: #fff;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #0F172A;
            z-index: 0;
        }

        #video:after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(37, 99, 235, 0.10),
                    transparent 45%
                );
            pointer-events: none;
        }

        #fullpage {
            position: relative;
            z-index: 99;
        }

        /* ==============================================
           E-BOOK CARD
        ================================================= */

        .ebook-section {
            margin-top: 20px;
        }

        .ebook-card {
            max-width: 320px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease,
                background 0.35s ease;
        }

        .ebook-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.09);
            border-color: #F97316;
            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25),
                0 0 25px rgba(249, 115, 22, 0.18);
        }

        .ebook-cover {
            display: block;
            overflow: hidden;
            border-radius: 10px;
        }

        .ebook-cover img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            transition: transform 0.4s ease;
        }

        .ebook-card:hover .ebook-cover img {
            transform: scale(1.03);
        }

        .ebook-info {
            padding-top: 18px;
            text-align: left;
        }

        .ebook-info h3 {
            margin: 0 0 8px;
            font-size: 17px;
            line-height: 1.4;
            font-weight: 700;
            text-transform: none;
            color: #fff;
        }

        .ebook-info p {
            margin: 0 0 15px;
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.65);
        }

        .ebook-button {
            display: inline-block;
            padding: 9px 18px;
            border: 1px solid #F97316;
            border-radius: 8px;
            background: rgba(249, 115, 22, 0.10);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .ebook-button:hover {
            background: #F97316;
            border-color: #F97316;
            color: #fff;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(249, 115, 22, 0.25);
        }

        /* ==============================================
           SOCIAL ICONS
        ================================================= */

        #social-icons {
            z-index: 199;
        }

        /* ==============================================
           PRELOADER
        ================================================= */

        .preloader {
            background: linear-gradient(
                135deg,
                #0F172A 0%,
                #172554 60%,
                #1E3A5F 100%
            );
        }

        .preloader-bounce > span:nth-child(1) {
            background: #F97316;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
        }

        .preloader-bounce > span:nth-child(2) {
            background: #FFFFFF;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }

        .preloader-bounce > span:nth-child(3) {
            background: #2563EB;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
        }

        /* ==============================================
           MOBILE
        ================================================= */

        @media screen and (max-width: 767px) {

            .section-inner {
                padding: 20px 20px 0;
            }

            .ebook-card {
                max-width: 270px;
                padding: 15px;
            }

            .ebook-info h3 {
                font-size: 15px;
            }

            .ebook-info p {
                font-size: 12px;
            }

        }

    </style>
